<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오운공 - 운동 기록</title>
<style>
  /* 오운공 화면 테마: 다크 기본. 무채색 바탕 + 라임 포인트 1색 */
  :root {
    color-scheme: dark;
    --bg: #0f1112; --card: #16191b; --raised: #202326; --text: #eceeea; --sub: #9ba1a7;
    --line: #272b2e; --accent: #c4f031; --accent-ink: #16181a; --accent-soft: #26300d; --accent-strong: #c4f031;
    --danger: #ff6b5f; --ink: #eceeea; --on-ink: #16181a;
    --cardio: var(--accent-soft); --cardio-text: #d6f76e; --strength: var(--raised); --strength-text: var(--text);
    --radius-card: 16px; --radius-ctl: 12px;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
         font-family: "Pretendard", "Pretendard Variable", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
         -webkit-font-smoothing: antialiased; font-feature-settings: "tnum"; }
  a { color: inherit; text-decoration: none; }
  input, select, textarea, button { font-family: inherit; font-size: 15px; color: inherit; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  header { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 86%, transparent);
           backdrop-filter: blur(14px) saturate(160%); -webkit-backdrop-filter: blur(14px) saturate(160%);
           border-bottom: 1px solid var(--line); }
  header .inner { max-width: 640px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px; }
  header .search { max-width: 640px; margin: 0 auto; padding: 0 20px 12px; }
  header .search input { width: 100%; padding: 11px 14px; border: 1px solid transparent; border-radius: var(--radius-ctl);
                         background: var(--raised); transition: border-color .2s, background .2s; }
  header .search input::placeholder { color: var(--sub); }
  header .search input:focus { outline: none; border-color: var(--ink); background: var(--card); }
  .logo { font-size: 22px; font-weight: 800; letter-spacing: -0.04em; white-space: nowrap; flex: none; }
  nav { display: flex; gap: 2px; margin-left: auto; padding: 3px; border-radius: 999px; background: var(--raised); }
  nav a { padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; color: var(--sub); white-space: nowrap;
          transition: background .2s var(--ease), color .2s; }
  nav a:hover { color: var(--text); }
  nav a.on { background: var(--card); color: var(--text); box-shadow: 0 1px 2px rgba(22, 24, 26, .08); }

  main { max-width: 640px; margin: 0 auto; padding: 20px 20px 64px; }
  main > * { animation: rise .45s var(--ease) both; }
  main > *:nth-child(2) { animation-delay: .05s; }
  main > *:nth-child(3) { animation-delay: .1s; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-card);
            margin-bottom: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .section-title { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                   padding: 18px 20px 8px; font-weight: 700; font-size: 17px; letter-spacing: -0.02em; color: var(--text); }

  .field { width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-ctl);
           background: var(--bg); transition: border-color .2s, background .2s; }
  .field::placeholder { color: var(--sub); }
  .field:focus { outline: none; border-color: var(--ink); background: var(--card); }
  textarea.field { resize: vertical; min-height: 88px; }
  label.lbl { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin: 16px 0 8px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row > * { min-width: 0; }
  .form { padding: 0 20px 20px; }
  .hint { font-size: 13px; color: var(--sub); margin-top: 6px; }

  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px;
         border-radius: var(--radius-ctl); background: var(--raised); }
  .seg button { border: 0; background: transparent; padding: 10px 0; border-radius: 9px; cursor: pointer;
                font-weight: 600; color: var(--sub); transition: background .2s var(--ease), color .2s; }
  .seg button.on { background: var(--ink); color: var(--on-ink); }

  .btn { display: inline-flex; align-items: center; justify-content: center; border: 1px solid transparent;
         border-radius: var(--radius-ctl); padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap;
         transition: transform .12s var(--ease), background .2s, border-color .2s; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover { background: color-mix(in srgb, var(--accent) 88%, #000); }
  .btn-gray { background: var(--raised); color: var(--text); }
  .btn-gray:hover { border-color: var(--line); background: color-mix(in srgb, var(--raised) 85%, var(--text) 6%); }
  .btn-danger { background: transparent; color: var(--danger); border-color: var(--line); }
  .btn-danger:hover { border-color: var(--danger); }
  .btn-link { background: none; border: 0; color: var(--accent-strong); font-weight: 700; cursor: pointer; padding: 4px 0;
              text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .btn:disabled, .btn-link:disabled { opacity: .45; cursor: default; }
  .btn.full { width: 100%; margin-top: 20px; padding: 13px; font-size: 15px; }

  /* 로그인 화면이 보일 때만 화면 정중앙에 배치 (창 높이가 바뀌어도 가운데 유지) */
  body:has(#auth:not([hidden])) { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
  .auth { width: min(380px, 100%); margin: 0; padding: 36px 28px 28px; text-align: left; animation: rise .45s var(--ease) both; }
  .auth .logo { display: block; font-size: 40px; margin-bottom: 28px; }
  .auth .logo::after { content: ""; display: block; width: 36px; height: 6px; margin-top: 10px; border-radius: 999px; background: var(--accent); }
  .auth .field { margin-bottom: 10px; }
  .auth .switch { margin-top: 18px; color: var(--sub); text-align: center; font-size: 14px; }

  .item { display: flex; gap: 14px; padding: 16px 20px; border-top: 1px solid var(--line); cursor: pointer;
          transition: background .2s; }
  .item:first-child { border-top: 0; }
  .item:hover { background: color-mix(in srgb, var(--raised) 55%, transparent); }
  .item .body { flex: 1; min-width: 0; }
  .item .kind { font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
  .item .memo { margin-top: 4px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .date { margin-top: 6px; color: var(--sub); font-size: 13px; }
  .thumb { flex: none; width: 64px; height: 64px; border-radius: var(--radius-ctl); object-fit: cover; background: var(--raised); }

  .author { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-weight: 700; font-size: 14px; }
  .avatar { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
            color: #fff; font-weight: 700; font-size: 13px; }
  .avatar.lg { width: 42px; height: 42px; font-size: 16px; }
  .avatar.xl { width: 84px; height: 84px; font-size: 32px; box-shadow: 0 0 0 4px var(--card), 0 0 0 6px var(--accent); }
  .user-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; }
  .user-row + .user-row { border-top: 1px solid var(--line); }
  .user-row .name { flex: 1; min-width: 0; font-weight: 700; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .profile-head { display: flex; gap: 22px; align-items: center; padding: 24px 20px; }
  .profile-head .info { flex: 1; min-width: 0; }
  .profile-head .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .profile-head .nick { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .stats { display: flex; gap: 20px; margin-top: 14px; color: var(--sub); font-size: 14px; }
  .stats b { font-weight: 800; font-size: 17px; color: var(--text); }
  .clickable { cursor: pointer; }
  .follow-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }

  /* 마이페이지 */
  img.avatar { object-fit: cover; background: var(--raised); }
  .profile-head .joined { color: var(--sub); font-size: 13px; margin-top: 4px; }
  .stats .link { cursor: pointer; }
  .stats .link:hover b { text-decoration: underline; text-underline-offset: 3px; }
  .edit-photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 4px 20px 16px; }
  .tile { background: var(--raised); border-radius: var(--radius-ctl); padding: 14px 16px; min-width: 0; }
  .tile .k { color: var(--sub); font-size: 13px; font-weight: 600; }
  .tile .v { font-size: 22px; font-weight: 800; letter-spacing: -0.03em; margin-top: 2px; }
  .tile .s { color: var(--sub); font-size: 13px; }
  .tile.link { cursor: pointer; transition: background .2s; }
  .tile.link:hover { background: color-mix(in srgb, var(--raised) 85%, var(--text) 6%); }
  .streak { margin: 0 20px 20px; padding: 14px 16px; border-radius: var(--radius-ctl); background: var(--accent-soft);
            color: var(--cardio-text); font-weight: 700; }
  .streak.off { background: var(--raised); color: var(--sub); font-weight: 600; }
  .chart { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 170px; padding: 8px 20px 0; }
  .chart .col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; min-width: 0; }
  .chart .val { font-size: 12px; font-weight: 700; color: var(--sub); white-space: nowrap; }
  .chart .b { width: 100%; max-width: 34px; min-height: 4px; border-radius: 8px 8px 4px 4px; background: var(--raised);
              transform-origin: bottom; animation: rise-bar .7s var(--ease) both; }
  .chart .b.has { background: var(--accent); }
  .chart-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; padding: 8px 20px 20px; text-align: center;
                font-size: 13px; color: var(--sub); font-weight: 600; }
  .chart-days .today { color: var(--text); }
  @keyframes rise-bar { from { transform: scaleY(0); } to { transform: none; } }
  .ratio { display: flex; align-items: center; gap: 24px; padding: 8px 20px 20px; }
  .donut { flex: none; position: relative; width: 120px; height: 120px; border-radius: 50%; }
  .donut::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: var(--card); }
  .legend { flex: 1; min-width: 0; display: grid; gap: 10px; }
  .legend .li { display: flex; align-items: center; gap: 10px; }
  .legend .dot { flex: none; width: 12px; height: 12px; border-radius: 4px; }
  .legend .pct { margin-left: auto; font-weight: 800; }
  .legend .sub { color: var(--sub); font-size: 13px; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 20px 14px; flex-wrap: wrap; }
  .toolbar .seg { min-width: 220px; }
  .seg.small button { padding: 7px 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
  .grid .empty { grid-column: 1 / -1; }
  .sq { position: relative; aspect-ratio: 1; overflow: hidden; cursor: pointer; background: var(--raised);
        display: grid; place-items: center; text-align: center; }
  .sq.CARDIO { background: var(--accent-soft); color: var(--cardio-text); }
  .sq img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .3s var(--ease); }
  .sq:hover img { transform: scale(1.04); }
  .sq .t { font-weight: 800; font-size: 15px; }
  .sq .d { font-size: 12px; opacity: .8; }
  .sq .cap { position: absolute; left: 6px; bottom: 6px; padding: 2px 7px; border-radius: 6px; font-size: 12px; font-weight: 700;
             background: rgba(0, 0, 0, .6); color: #fff; }

  /* 주간 랭킹 */
  .week-nav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
              padding: 16px 20px; border-bottom: 1px solid var(--line); }
  .week-nav .label { text-align: center; min-width: 0; word-break: keep-all; }
  .week-nav .label b { display: block; font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
  .week-nav .label span { color: var(--sub); font-size: 13px; }
  .rank-row { display: flex; align-items: center; gap: 14px; padding: 14px 20px; border-top: 1px solid var(--line);
              cursor: pointer; transition: background .2s; }
  .week-nav + .rank-row { border-top: 0; }
  .rank-row:hover { background: color-mix(in srgb, var(--raised) 55%, transparent); }
  .rank-row.me { background: var(--accent-soft); }
  .rank-num { flex: none; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 50%;
              font-weight: 800; font-size: 15px; color: var(--sub); }
  /* 1~3위 메달: 금, 은, 동 (이모지 대신 CSS로 그림) */
  .rank-num.medal { position: relative; width: 34px; height: 34px; font-size: 15px;
                    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .35); }
  .rank-num.medal::after { content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .35); }
  .rank-num.medal-1 { background: linear-gradient(145deg, #f7dc7c, #d6a624); color: #3d2c00; }
  .rank-num.medal-2 { background: linear-gradient(145deg, #eef1f4, #aab2bb); color: #262b31; }
  .rank-num.medal-3 { background: linear-gradient(145deg, #e8ab78, #b06a36); color: #3a1c06; }
  .rank-row .who { flex: 1; min-width: 0; }
  .rank-row .who .nick { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { height: 6px; border-radius: 999px; background: var(--raised); margin-top: 8px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 999px; background: var(--accent); transform-origin: left;
               animation: grow .7s var(--ease) both; }
  .rank-row .mins { flex: none; min-width: 84px; text-align: right; font-weight: 800; font-size: 15px; }
  .my-rank { padding: 14px 20px 18px; color: var(--sub); font-size: 13px; text-align: center; border-top: 1px solid var(--line); }
  @keyframes grow { from { transform: scaleX(0); } to { transform: none; } }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700;
           margin-right: 8px; vertical-align: 2px; }
  .badge.CARDIO { background: var(--cardio); color: var(--cardio-text); }
  .badge.STRENGTH { background: var(--strength); color: var(--strength-text); }

  /* 댓글 */
  .comment-row { display: flex; gap: 10px; padding: 12px 20px; align-items: flex-start; border-top: 1px solid var(--line); }
  .comment-row .body { flex: 1; min-width: 0; }
  .comment-row .nick { font-weight: 700; font-size: 13px; margin-bottom: 2px; }
  .comment-row .content { white-space: pre-wrap; word-break: break-word; }
  .comment-form { display: flex; gap: 8px; padding: 16px 20px; align-items: flex-start; }
  .comment-form textarea { flex: 1; min-height: 40px; }
  .comment-form .btn { flex: none; }

  .detail { padding: 20px; }
  .detail .photo { width: 100%; max-height: 440px; object-fit: contain; background: #0f1112; border-radius: var(--radius-ctl); display: block; }
  .detail .no-photo { padding: 36px 16px; text-align: center; color: var(--sub); border: 1px dashed var(--line); border-radius: var(--radius-ctl); }
  .detail dl { display: grid; grid-template-columns: 80px 1fr; gap: 12px 14px; margin: 20px 0; }
  .detail dt { color: var(--sub); }
  .detail dd { margin: 0; white-space: pre-wrap; word-break: break-word; font-weight: 600; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .empty { color: var(--sub); text-align: center; padding: 36px 24px; line-height: 1.6; }
  main { overflow-anchor: none; }
  .pager { display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px;
           padding: 14px 20px 18px; border-top: 1px solid var(--line); }
  .pager button { min-width: 36px; height: 36px; padding: 0 12px; border: 1px solid transparent; border-radius: 10px;
                  background: transparent; color: var(--sub); font-weight: 700; font-size: 14px; cursor: pointer;
                  transition: background .2s, color .2s, border-color .2s; }
  .pager button:hover:not(:disabled) { color: var(--text); border-color: var(--line); }
  .pager button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
  .pager button:disabled { opacity: .35; cursor: default; }
  .pager .step { color: var(--text); }
  .msg { min-height: 20px; margin-top: 10px; font-size: 13px; color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 12px); background: var(--ink); color: var(--on-ink);
           padding: 12px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0;
           transition: opacity .25s var(--ease), transform .25s var(--ease); pointer-events: none; z-index: 3; box-shadow: var(--shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  input[type="file"] { font-size: 14px; color: var(--sub); max-width: 100%; }
  input[type="file"]::file-selector-button { margin-right: 12px; padding: 9px 14px; border: 1px solid var(--line);
                                             border-radius: var(--radius-ctl); background: var(--raised); color: var(--text);
                                             font: inherit; font-weight: 600; cursor: pointer; }
  input[type="file"]::file-selector-button:hover { border-color: var(--ink); }
  [hidden] { display: none !important; }

  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  @media (max-width: 480px) {
    header .inner, header .search, main { padding-left: 16px; padding-right: 16px; }
    header .inner { gap: 8px; }
    header .logo { font-size: 20px; }
    nav a { padding: 6px 10px; font-size: 13px; }
    header .btn { padding: 7px 10px; font-size: 13px; }
    .section-title, .item, .user-row, .form, .detail { padding-left: 16px; padding-right: 16px; }
    .profile-head { gap: 16px; }
    .avatar.xl { width: 68px; height: 68px; font-size: 26px; }
    .row { grid-template-columns: 1fr; }
    .week-nav { padding: 14px 16px; gap: 8px; }
    .week-nav .btn { padding: 7px 10px; font-size: 13px; }
    .rank-row { padding: 12px 16px; gap: 10px; }
    .rank-row .mins { min-width: 72px; font-size: 14px; }
    .tiles, .ratio, .toolbar { padding-left: 16px; padding-right: 16px; }
    .chart, .chart-days { padding-left: 12px; padding-right: 12px; gap: 5px; }
    .streak { margin-left: 16px; margin-right: 16px; }
    .donut { width: 96px; height: 96px; }
    .donut::after { inset: 18px; }
    .ratio { gap: 16px; }
  }
</style>
</head>
<body>

<!-- 로그인 · 회원가입 -->
<section id="auth" class="auth" hidden>
  <span class="logo">오운공</span>
  <input id="email" class="field" type="email" placeholder="이메일" autocomplete="username">
  <input id="password" class="field" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="current-password">
  <input id="nickname" class="field" placeholder="닉네임" hidden>
  <button id="submitBtn" class="btn btn-primary full" style="margin-top: 8px;">로그인</button>
  <div id="authMsg" class="msg"></div>
  <div class="switch"><span id="switchText">계정이 없으신가요?</span>
    <button id="switchBtn" class="btn-link">가입하기</button></div>
</section>

<!-- 로그인 후 -->
<div id="app" hidden>
  <header>
    <div class="inner">
      <a class="logo" href="#/">오운공</a>
      <nav>
        <a id="navFeed" href="#/">피드</a>
        <a id="navRank" href="#/ranking">랭킹</a>
        <a id="navMe" href="#/me">마이</a>
      </nav>
      <button id="logoutBtn" class="btn btn-gray">로그아웃</button>
    </div>
    <div class="search"><input id="searchInput" type="search" placeholder="닉네임으로 사람 검색"></div>
  </header>
  <main id="view"></main>
</div>

<div id="toast" class="toast"></div>

<script>
  const PAGE_SIZE = 20;       // 서버가 한 번에 주는 개수 (피드, 사람 찾기)
  const WORKOUT_PAGE = 8;     // 운동 기록 목록을 한 화면에 보여 줄 개수
  const MAX_PHOTO_BYTES = 5 * 1024 * 1024;
  const PHOTO_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  const TYPE_LABELS = { CARDIO: '유산소', STRENGTH: '무산소' };
  const $ = (id) => document.getElementById(id);
  let me = null;
  let signupMode = false;
  let viewSeq = 0;  // 화면을 빠르게 옮길 때 늦게 도착한 이전 응답이 새 화면을 덮지 않게 함

  // 저장소 접근이 막힌 브라우저에서도 화면은 동작하게 함
  const store = {
    get: () => { try { return localStorage.getItem('accessToken'); } catch { return null; } },
    set: (t) => { try { localStorage.setItem('accessToken', t); } catch {} },
    clear: () => { try { localStorage.removeItem('accessToken'); } catch {} },
  };
  let token = store.get();

  // 서버는 오류를 상태 코드로만 돌려주므로 화면 문구는 여기서 정함
  const MESSAGES = {
    login: { 401: '이메일 또는 비밀번호가 올바르지 않아요.', 400: '이메일과 비밀번호를 확인하세요.' },
    signup: { 409: '이미 가입된 이메일이에요.', 400: '입력값을 확인하세요. (비밀번호 8자 이상, 닉네임 필수)' },
    create: { 400: '입력값을 확인하세요.' },
    photo: { 400: 'JPG · PNG · WEBP, 5MB 이하 사진만 올릴 수 있어요.', 403: '내 기록에만 사진을 올릴 수 있어요.', 404: '없는 기록이에요.', 413: '사진은 5MB 이하만 올릴 수 있어요.' },
    remove: { 403: '내 기록만 삭제할 수 있어요.', 404: '이미 삭제된 기록이에요.' },
  };

  // body 가 FormData 면 Content-Type 을 브라우저가 경계값과 함께 정하도록 비워 둠
  async function api(method, url, body) {
    const headers = {};
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const isForm = body instanceof FormData;
    if (body && !isForm) headers['Content-Type'] = 'application/json';
    const res = await fetch(url, { method, headers, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
    if (res.status === 401 && token) {  // 토큰 만료
      logout('로그인이 만료되었어요. 다시 로그인하세요.');
    }
    const data = res.status === 204 ? null : await res.json().catch(() => null);
    return { status: res.status, ok: res.ok, data };
  }

  function toast(text) {
    const t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => t.classList.remove('show'), 2000);
  }

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text != null) e.textContent = text;  // 사용자 입력은 textContent 로만 넣어 스크립트 삽입을 막음
    return e;
  }

  // 사진 주소는 서버가 만든 /photos/... 만 씀
  const safePhoto = (url) => (typeof url === 'string' && url.startsWith('/photos/') ? url : null);

  function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return (y === new Date().getFullYear() ? '' : y + '년 ') + m + '월 ' + d + '일';
  }

  function badge(type) {
    return el('span', 'badge ' + type, TYPE_LABELS[type] || type);
  }

  function summary(w) {
    return w.durationMin + '분' + (w.distanceKm != null ? ' · ' + Number(w.distanceKm) + 'km' : '');
  }

  // 사진 파일을 서버에 보내기 전에 한 번 거름. 통과하면 null
  function checkPhoto(file) {
    if (!PHOTO_TYPES.includes(file.type)) return 'JPG · PNG · WEBP 사진만 올릴 수 있어요.';
    if (file.size > MAX_PHOTO_BYTES) return '사진은 5MB 이하만 올릴 수 있어요.';
    return null;
  }

  async function uploadPhoto(workoutId, file) {
    const form = new FormData();
    form.append('photo', file);
    return api('POST', '/workouts/' + workoutId + '/photos', form);
  }

  // ---------- 로그인 ----------

  function setSignupMode(on) {
    signupMode = on;
    $('nickname').hidden = !on;
    $('submitBtn').textContent = on ? '가입하기' : '로그인';
    $('switchText').textContent = on ? '계정이 있으신가요?' : '계정이 없으신가요?';
    $('switchBtn').textContent = on ? '로그인' : '가입하기';
    $('authMsg').textContent = '';
  }

  async function submitAuth() {
    const email = $('email').value, password = $('password').value;
    if (signupMode) {
      const r = await api('POST', '/auth/signup', { email, password, nickname: $('nickname').value });
      if (!r.ok) return ($('authMsg').textContent = MESSAGES.signup[r.status] || '가입 실패 (' + r.status + ')');
    }
    const r = await api('POST', '/auth/login', { email, password });
    if (!r.ok) return ($('authMsg').textContent = MESSAGES.login[r.status] || '로그인 실패 (' + r.status + ')');
    token = r.data.accessToken;
    store.set(token);
    setSignupMode(false);
    enter();
  }

  function logout(reason) {
    token = null;
    me = null;
    store.clear();
    $('app').hidden = true;
    $('auth').hidden = false;
    $('authMsg').textContent = reason || '';
  }

  async function enter() {
    const r = await api('GET', '/users/me');
    if (!r.ok) return logout();
    me = r.data;
    $('auth').hidden = true;
    $('app').hidden = false;
    route();
  }

  // ---------- 화면 ----------

  function newView() {
    viewSeq++;
    const v = $('view');
    v.replaceChildren();
    window.scrollTo(0, 0);
    return { v, seq: viewSeq };
  }

  // 관심 피드 (10. 팔로우한 사람들 기록 최신순 20개씩, 배열 응답)
  function feedView() {
    const { v, seq } = newView();
    const box = el('section');
    box.appendChild(el('div', 'section-title', '관심 피드'));
    v.appendChild(box);

    // 서버는 20개씩 고정이라 받아 둔 서버 페이지를 WORKOUT_PAGE 개씩 잘라서 보여 줌
    const serverPages = new Map();
    async function serverPage(n) {
      if (!serverPages.has(n)) {
        const r = await api('GET', '/feed?page=' + n);
        if (!r.ok) return null;
        serverPages.set(n, r.data);
      }
      return serverPages.get(n);
    }

    let suggested = false;
    pagedList(box, async (page) => {
      const start = page * WORKOUT_PAGE;
      const end = start + WORKOUT_PAGE;
      const items = [];
      let n = Math.floor(start / PAGE_SIZE);
      let data;
      // 이 화면에 필요한 구간과, 다음 화면이 있는지 알 수 있는 한 칸 뒤까지 모음
      while ((data = await serverPage(n)) !== null) {
        data.forEach((w, i) => {
          const idx = n * PAGE_SIZE + i;
          if (idx >= start && idx <= end) items.push(w);
        });
        if (data.length < PAGE_SIZE || (n + 1) * PAGE_SIZE > end) break;
        n++;
      }
      if (data === null) return { ok: false, items: [], hasMore: false };
      return { ok: true, items: items.slice(0, WORKOUT_PAGE), hasMore: items.length > WORKOUT_PAGE };
    }, (w) => listItem(w, true), '아직 관심 피드가 비어 있어요. 위에서 닉네임을 검색해 팔로우해 보세요.', seq, {
      errorText: '피드를 불러오지 못했어요.',
      onLoad: (r, page) => {
        if (page === 0 && r.items.length === 0 && !suggested) {
          suggested = true;
          suggestUsers(v, seq);
        }
      },
    });
  }

  // 프로필 사진이 있으면 사진, 없으면 닉네임 첫 글자 + id별 고정 색
  const COLORS = ['#3f5a7a', '#6b4f7a', '#2f6b5e', '#8a5a3c', '#4f6b00', '#7a4a52', '#35607f', '#5c5f3a'];
  function avatar(id, nickname, photoUrl) {
    const photo = safePhoto(photoUrl);
    if (photo) {
      const img = el('img', 'avatar');
      img.src = photo;
      img.alt = (nickname || '') + ' 프로필 사진';
      return img;
    }
    const a = el('div', 'avatar', (nickname || '?').charAt(0).toUpperCase());
    a.style.background = COLORS[id % COLORS.length];
    return a;
  }

  const DAY_LABELS = ['월', '화', '수', '목', '금', '토', '일'];
  const TYPE_COLORS = { CARDIO: 'var(--accent)', STRENGTH: '#7d8a96' };
  const formatJoined = (s) => s.replaceAll('-', '. ') + '. 가입';

  // 마이페이지: 1. 프로필 카드 2. 운동 요약 3. 이번 주 그래프 4. 종류 비율 5. 내 기록
  async function myView(openForm) {
    const { v, seq } = newView();
    const [pr, sr, wr] = await Promise.all([
      api('GET', '/users/' + me.id + '/profile'),
      api('GET', '/users/me/summary'),
      api('GET', '/users/me/stats/weekly'),
    ]);
    if (seq !== viewSeq) return;
    if (!pr.ok) {
      v.appendChild(el('section')).appendChild(el('div', 'empty', '마이페이지를 불러오지 못했어요.'));
      return;
    }
    v.appendChild(profileCard(pr.data));
    if (sr.ok) v.appendChild(summarySection(sr.data));
    if (wr.ok) v.appendChild(weeklyChart(wr.data));
    if (sr.ok && wr.ok) v.appendChild(typeRatio(sr.data.byType, wr.data.byType));
    myRecords(v, seq, openForm);
  }

  // 1. 프로필 카드 + 수정 패널
  function profileCard(pf) {
    const wrap = el('div');
    const head = el('section', 'profile-head');
    const a = avatar(pf.id, pf.nickname, pf.photoUrl);
    a.classList.add('xl');
    const info = el('div', 'info');
    const top = el('div', 'top');
    top.appendChild(el('span', 'nick', pf.nickname));
    const editBtn = el('button', 'btn btn-gray', '프로필 수정');
    top.appendChild(editBtn);
    const stats = el('div', 'stats');
    const stat = (label, num, href) => {
      const x = el('span', href ? 'link' : null);
      x.append(label + ' ', el('b', null, num));
      if (href) x.onclick = () => { location.hash = href; };
      return x;
    };
    stats.append(stat('기록', pf.workoutCount),
        stat('팔로워', pf.followerCount, '#/users/' + pf.id + '/followers'),
        stat('팔로잉', pf.followeeCount, '#/users/' + pf.id + '/followees'));
    info.append(top, el('div', 'joined', formatJoined(pf.joinedAt)), stats);
    head.append(a, info);

    const panel = editPanel(pf);
    panel.hidden = true;
    editBtn.onclick = () => {
      panel.hidden = !panel.hidden;
      editBtn.textContent = panel.hidden ? '프로필 수정' : '닫기';
      if (!panel.hidden) panel.querySelector('#pNick').focus();
    };
    wrap.append(head, panel);
    return wrap;
  }

  function editPanel(pf) {
    const box = el('section');
    box.appendChild(el('div', 'section-title', '프로필 수정'));
    const f = el('div', 'form');
    f.innerHTML = `
      <label class="lbl" for="pNick">닉네임</label>
      <input id="pNick" class="field" maxlength="30">
      <label class="lbl">프로필 사진</label>
      <div class="edit-photo">
        <span id="pPreview"></span>
        <input id="pPhoto" type="file" accept="image/jpeg,image/png,image/webp">
        <button id="pPhotoDel" type="button" class="btn btn-danger">사진 삭제</button>
      </div>
      <div class="hint">JPG · PNG · WEBP, 5MB 이하. 고르면 바로 바뀌어요.</div>
      <button id="pSave" class="btn btn-primary full">닉네임 저장</button>
      <div id="pMsg" class="msg"></div>`;
    box.appendChild(f);
    const q = (id) => f.querySelector('#' + id);
    q('pNick').value = pf.nickname;
    const preview = (url) => {
      const a = avatar(pf.id, q('pNick').value || pf.nickname, url);
      a.classList.add('lg');
      q('pPreview').replaceChildren(a);
      q('pPhotoDel').hidden = !url;
    };
    preview(pf.photoUrl);

    q('pSave').onclick = async () => {
      const nick = q('pNick').value.trim();
      if (!nick) return (q('pMsg').textContent = '닉네임을 입력하세요.');
      q('pSave').disabled = true;
      const r = await api('PATCH', '/users/me', { nickname: nick });
      q('pSave').disabled = false;
      if (!r.ok) return (q('pMsg').textContent = r.status === 400 ? '닉네임은 1~30자로 입력하세요.' : '저장하지 못했어요. (' + r.status + ')');
      me.nickname = r.data.nickname;
      toast('닉네임을 바꿨어요.');
      myView();
    };
    q('pPhoto').onchange = async () => {
      const file = q('pPhoto').files[0];
      if (!file) return;
      const err = checkPhoto(file);
      if (err) return toast(err);
      const form = new FormData();
      form.append('photo', file);
      const r = await api('POST', '/users/me/photo', form);
      if (!r.ok) return toast(MESSAGES.photo[r.status] || '사진을 올리지 못했어요. (' + r.status + ')');
      toast('프로필 사진을 바꿨어요.');
      myView();
    };
    q('pPhotoDel').onclick = async () => {
      if (!confirm('프로필 사진을 삭제할까요?')) return;
      const r = await api('DELETE', '/users/me/photo');
      if (!r.ok) return toast('삭제하지 못했어요. (' + r.status + ')');
      toast('프로필 사진을 삭제했어요.');
      myView();
    };
    return box;
  }

  // 2. 운동 요약
  function summarySection(sm) {
    const box = el('section');
    box.appendChild(el('div', 'section-title', '운동 요약'));
    const tiles = el('div', 'tiles');
    const tile = (k, value, sub, href) => {
      const t = el('div', 'tile' + (href ? ' link' : ''));
      t.append(el('div', 'k', k), el('div', 'v', value));
      if (sub) t.appendChild(el('div', 's', sub));
      if (href) t.onclick = () => { location.hash = href; };
      return t;
    };
    tiles.append(
      tile('누적 운동 시간', formatMinutes(sm.totalMinutes), '전체 ' + sm.totalCount + '회'),
      tile('이번 주 운동', formatMinutes(sm.weekMinutes), sm.weekCount + '회'),
      tile('이번 주 랭킹', sm.weekRank ? sm.weekRank + '위' : '-', sm.weekRank ? '랭킹 보기 →' : '기록하면 순위에 올라요', '#/ranking'),
      tile('연속 운동', sm.streakDays + '일', sm.streakDays ? '오늘까지 이어지는 중' : '아직 없어요'));
    box.appendChild(tiles);
    const streak = el('div', 'streak' + (sm.streakDays ? '' : ' off'),
        sm.streakDays >= 2 ? '🔥 ' + sm.streakDays + '일 연속 오운공 중!'
          : sm.streakDays === 1 ? '🔥 연속 운동 1일째. 내일도 이어 가요!'
          : '오늘 운동을 기록하고 연속 기록을 시작해 보세요.');
    box.appendChild(streak);
    return box;
  }

  // 3. 이번 주 요일별 운동 시간 (11. 주간 통계)
  function weeklyChart(ws) {
    const box = el('section');
    const title = el('div', 'section-title');
    title.append(el('span', null, '이번 주 운동'),
        el('span', 'hint', ws.workoutCount + '회 · ' + formatMinutes(ws.totalMinutes)));
    box.appendChild(title);
    const max = Math.max(...ws.days.map((d) => d.minutes), 1);
    const chart = el('div', 'chart');
    const days = el('div', 'chart-days');
    const todayStr = today();
    ws.days.forEach((d, i) => {
      const col = el('div', 'col');
      col.appendChild(el('div', 'val', d.minutes ? d.minutes + '분' : ''));
      const b = el('div', 'b' + (d.minutes ? ' has' : ''));
      b.style.height = d.minutes ? Math.max(6, Math.round((d.minutes / max) * 120)) + 'px' : '4px';
      b.title = d.date + ' ' + d.minutes + '분';
      col.appendChild(b);
      chart.appendChild(col);
      days.appendChild(el('span', d.date === todayStr ? 'today' : null, DAY_LABELS[i]));
    });
    box.append(chart, days);
    return box;
  }

  // 4. 운동 종류 비율 (시간 기준). 전체 기간 / 이번 주 전환
  function typeRatio(allTypes, weekTypes) {
    const box = el('section');
    const title = el('div', 'section-title');
    const seg = el('div', 'seg small');
    const bAll = el('button', 'on', '전체');
    const bWeek = el('button', null, '이번 주');
    seg.append(bAll, bWeek);
    title.append(el('span', null, '운동 종류 비율'), seg);
    box.appendChild(title);
    const body = el('div');
    box.appendChild(body);
    const render = (types) => {
      body.replaceChildren();
      const total = types.reduce((sum, t) => sum + t.minutes, 0);
      if (!total) return body.appendChild(el('div', 'empty', '아직 기록이 없어요.'));
      const ratio = el('div', 'ratio');
      const donut = el('div', 'donut');
      const legend = el('div', 'legend');
      let acc = 0;
      const stops = [];
      ['CARDIO', 'STRENGTH'].forEach((type) => {
        const t = types.find((x) => x.type === type) || { count: 0, minutes: 0 };
        const pct = Math.round((t.minutes / total) * 100);
        stops.push(TYPE_COLORS[type] + ' ' + acc + '% ' + (acc + (t.minutes / total) * 100) + '%');
        acc += (t.minutes / total) * 100;
        const li = el('div', 'li');
        const dot = el('span', 'dot');
        dot.style.background = TYPE_COLORS[type];
        const name = el('div');
        name.append(el('div', null, TYPE_LABELS[type]), el('div', 'sub', t.count + '회 · ' + formatMinutes(t.minutes)));
        li.append(dot, name, el('span', 'pct', pct + '%'));
        legend.appendChild(li);
      });
      donut.style.background = 'conic-gradient(' + stops.join(', ') + ')';
      donut.setAttribute('role', 'img');
      donut.setAttribute('aria-label', legend.innerText.replace(/\n/g, ' '));
      ratio.append(donut, legend);
      body.appendChild(ratio);
    };
    bAll.onclick = () => { bAll.classList.add('on'); bWeek.classList.remove('on'); render(allTypes); };
    bWeek.onclick = () => { bWeek.classList.add('on'); bAll.classList.remove('on'); render(weekTypes); };
    render(allTypes);
    return box;
  }

  // 5. 내 기록: 종류 탭, 사진 그리드 / 목록 전환, [+ 기록하기]
  function myRecords(v, seq, openForm) {
    const form = createForm();
    form.hidden = !openForm;
    const box = el('section');
    const title = el('div', 'section-title');
    const count = el('span', null, '내 운동 기록');
    const toggle = el('button', 'btn btn-primary');
    const renderToggle = () => {
      toggle.textContent = form.hidden ? '+ 기록하기' : '닫기';
      toggle.className = 'btn ' + (form.hidden ? 'btn-primary' : 'btn-gray');
    };
    toggle.onclick = () => {
      form.hidden = !form.hidden;
      renderToggle();
      if (!form.hidden) {
        form.scrollIntoView({ behavior: 'smooth', block: 'start' });
        form.querySelector('#fDuration').focus({ preventScroll: true });
      }
    };
    renderToggle();
    title.append(count, toggle);
    box.appendChild(title);

    const toolbar = el('div', 'toolbar');
    const typeSeg = el('div', 'seg small');
    const viewSeg = el('div', 'seg small');
    toolbar.append(typeSeg, viewSeg);
    box.appendChild(toolbar);
    const listBox = el('div');
    box.appendChild(listBox);
    v.append(form, box);

    let type = '';
    let mode = 'grid';
    const makeSeg = (seg, options, current, onPick) => {
      seg.replaceChildren();
      options.forEach(([value, label]) => {
        const b = el('button', value === current ? 'on' : null, label);
        b.type = 'button';
        b.onclick = () => onPick(value);
        seg.appendChild(b);
      });
    };
    const load = () => {
      makeSeg(typeSeg, [['', '전체'], ['CARDIO', '유산소'], ['STRENGTH', '무산소']], type, (t) => { type = t; load(); });
      makeSeg(viewSeg, [['grid', '▦ 사진'], ['list', '☰ 목록']], mode, (m) => { mode = m; load(); });
      listBox.replaceChildren();
      const size = mode === 'grid' ? 9 : WORKOUT_PAGE;
      pagedList(listBox, async (page) => pageResult(await api('GET', '/users/' + me.id + '/workouts?page=' + page
          + '&size=' + size + (type ? '&type=' + type : ''))),
        mode === 'grid' ? gridTile : (w) => listItem(w),
        type ? '이 종류의 기록이 없어요.' : '아직 기록이 없어요. [+ 기록하기]로 첫 운동을 기록해 보세요.', seq, {
          errorText: '기록을 불러오지 못했어요.',
          listClass: mode === 'grid' ? 'grid' : null,
          onLoad: (r) => { count.textContent = '내 운동 기록 ' + r.total + '개'; },
        });
    };
    load();
  }

  // 인스타 프로필처럼 정사각형 칸. 인증 사진이 없으면 종류 · 시간을 글자로 보여 줌
  function gridTile(w) {
    const t = el('div', 'sq ' + w.type);
    t.onclick = () => { location.hash = '#/workouts/' + w.id; };
    t.title = (TYPE_LABELS[w.type] || w.type) + ' ' + summary(w) + ' · ' + formatDate(w.workoutDate);
    const photo = safePhoto(w.photoUrl);
    if (photo) {
      const img = el('img');
      img.src = photo;
      img.alt = '인증 사진';
      img.loading = 'lazy';
      t.append(img, el('span', 'cap', w.durationMin + '분'));
    } else {
      const inner = el('div');
      inner.append(el('div', 't', (TYPE_LABELS[w.type] || w.type) + ' ' + w.durationMin + '분'),
          el('div', 'd', formatDate(w.workoutDate)));
      t.appendChild(inner);
    }
    return t;
  }

  // 팔로워 · 팔로잉 목록 (탭으로 전환)
  async function followListView(userId, kind) {
    const { v, seq } = newView();
    const pr = await api('GET', '/users/' + userId + '/profile');
    if (seq !== viewSeq) return;
    const box = el('section');

    { errorText: '목록을 불러오지 못했어요.' });

  // 4. 기록 등록 (+ 13. 사진은 등록 뒤 이어서 올림)
  function createForm() {
    const box = el('section');
    box.appendChild(el('div', 'section-title', '운동 기록하기'));
    const f = el('div', 'form');
    f.innerHTML = `
      <label class="lbl">종류</label>
      <div class="seg" id="typeSeg">
        <button type="button" data-type="CARDIO" class="on">유산소</button>
        <button type="button" data-type="STRENGTH">무산소</button>
      </div>
      <div class="row">
        <div><label class="lbl" for="fDuration">운동 시간 (분)</label>
          <input id="fDuration" class="field" type="number" min="1" max="300" placeholder="1~300"></div>
        <div id="distanceWrap"><label class="lbl" for="fDistance">거리 (km, 선택)</label>
          <input id="fDistance" class="field" type="number" min="0.01" step="0.01" placeholder="예: 5.2"></div>
      </div>
      <label class="lbl" for="fDate">날짜</label>
      <input id="fDate" class="field" type="date">
      <label class="lbl" for="fMemo">메모 (선택)</label>
      <textarea id="fMemo" class="field" maxlength="500" placeholder="오늘 운동은 어땠나요?"></textarea>
      <div class="hint"><span id="memoCount">0</span> / 500</div>
      <label class="lbl" for="fPhoto">인증 사진 (선택)</label>
      <input id="fPhoto" type="file" accept="image/jpeg,image/png,image/webp">
      <div class="hint">JPG · PNG · WEBP, 5MB 이하</div>
      <button id="fSubmit" class="btn btn-primary full">기록하기</button>
      <div id="fMsg" class="msg"></div>`;
    box.appendChild(f);

    let type = 'CARDIO';
    const q = (id) => f.querySelector('#' + id);
    q('fDate').value = today();
    q('fDate').max = today();
    f.querySelectorAll('#typeSeg button').forEach((b) => {
      b.onclick = () => {
        type = b.dataset.type;
        f.querySelectorAll('#typeSeg button').forEach((x) => x.classList.toggle('on', x === b));
        // 거리는 유산소일 때만 입력함
        q('distanceWrap').style.visibility = type === 'CARDIO' ? 'visible' : 'hidden';
        if (type !== 'CARDIO') q('fDistance').value = '';
      };
    });
    q('fMemo').oninput = () => { q('memoCount').textContent = q('fMemo').value.length; };

    q('fSubmit').onclick = async () => {
      const msg = q('fMsg');
      const duration = Number(q('fDuration').value);
      const distanceRaw = q('fDistance').value;
      const date = q('fDate').value;
      const file = q('fPhoto').files[0];
      // 서버 검증(@Min · @Max · @PastOrPresent 등)과 같은 규칙을 먼저 확인함
      if (!Number.isInteger(duration) || duration < 1 || duration > 300) return (msg.textContent = '운동 시간은 1~300분 사이 정수로 입력하세요.');
      if (distanceRaw && !(Number(distanceRaw) >= 0.01)) return (msg.textContent = '거리는 0.01km 이상으로 입력하세요.');
      if (!date) return (msg.textContent = '날짜를 선택하세요.');
      if (date > today()) return (msg.textContent = '미래 날짜는 기록할 수 없어요.');
      if (file && checkPhoto(file)) return (msg.textContent = checkPhoto(file));
      msg.textContent = '';

      q('fSubmit').disabled = true;
      const r = await api('POST', '/workouts', {
        type,
        durationMin: duration,
        distanceKm: type === 'CARDIO' && distanceRaw ? Number(distanceRaw) : null,
        memo: q('fMemo').value.trim() || null,
        workoutDate: date,
      });
      if (!r.ok) {
        q('fSubmit').disabled = false;
        return (msg.textContent = MESSAGES.create[r.status] || '기록하지 못했어요. (' + r.status + ')');
      }
      if (file) {
        const p = await uploadPhoto(r.data.id, file);
        if (!p.ok) toast('기록은 저장했지만 사진을 올리지 못했어요. 상세 화면에서 다시 올려 주세요.');
        else toast('기록했어요.');
      } else {
        toast('기록했어요.');
      }
      myView();  // 폼을 비우고 목록을 새로 불러옴
    };
    return box;
  }

  // 5. 기록 상세 (+ 13. 사진 첨부 · 교체, 7. 삭제)
  async function detailView(id) {
    const { v, seq } = newView();
    const r = await api('GET', '/workouts/' + id);
    if (seq !== viewSeq) return;
    const box = el('section');
    v.appendChild(box);
    const back = el('button', 'btn-link', '← 뒤로');
    back.onclick = () => (history.length > 1 ? history.back() : (location.hash = '#/'));
    const title = el('div', 'section-title');
    title.appendChild(back);
    box.appendChild(title);
    if (!r.ok) {
      box.appendChild(el('div', 'empty', r.status === 404 ? '없는 기록이에요.' : '기록을 불러오지 못했어요.'));
      return;
    }
    const w = r.data;
    const mine = me && w.userId === me.id;
    const d = el('div', 'detail');

    // 남의 기록이면 작성자 + 팔로우 버튼 (팔로우 여부를 알려 주는 API가 없어 409를 받으면 팔로우 중으로 바꿈)
    if (!mine) {
      const fr = el('div', 'follow-row');
      const author = el('div', 'author clickable');
      author.style.marginBottom = '0';
      author.append(avatar(w.userId, w.nickname), w.nickname);
      author.onclick = () => goProfile(w.userId);
      fr.appendChild(author);
      d.appendChild(fr);
      // 팔로우 여부는 프로필 API로 확인한 뒤 버튼을 붙임
      api('GET', '/users/' + w.userId + '/profile').then((p) => {
        if (seq === viewSeq && p.ok) fr.appendChild(followButton(w.userId, p.data.following));
      });
    }

    const photo = safePhoto(w.photoUrl);
    if (photo) {
      const img = el('img', 'photo');
      img.src = photo;
      img.alt = '인증 사진';
      d.appendChild(img);
    } else {
      d.appendChild(el('div', 'no-photo', '인증 사진이 없어요.'));
    }

    const dl = el('dl');
    const row = (label, value) => {
      const dd = el('dd');
      dd.append(value);  // 문자열은 글자로, 요소(배지)는 그대로 들어감
      dl.append(el('dt', null, label), dd);
    };
    row('종류', badge(w.type));
    row('시간', w.durationMin + '분');
    if (w.distanceKm != null) row('거리', Number(w.distanceKm) + 'km');
    row('날짜', formatDate(w.workoutDate));
    if (mine) row('작성자', w.nickname + ' (나)');
    row('메모', w.memo || '-');
    d.appendChild(dl);

    if (mine) {
      const actions = el('div', 'actions');
      const file = el('input');
      file.type = 'file';
      file.accept = 'image/jpeg,image/png,image/webp';
      file.hidden = true;
      const photoBtn = el('button', 'btn btn-gray', photo ? '사진 바꾸기' : '사진 올리기');
      photoBtn.onclick = () => file.click();
      file.onchange = async () => {
        const f = file.files[0];
        if (!f) return;
        const err = checkPhoto(f);
        if (err) return toast(err);
        photoBtn.disabled = true;
        const p = await uploadPhoto(w.id, f);
        photoBtn.disabled = false;
        if (!p.ok) return toast(MESSAGES.photo[p.status] || '사진을 올리지 못했어요. (' + p.status + ')');
        toast(photo ? '사진을 바꿨어요.' : '사진을 올렸어요.');
        detailView(w.id);
      };
      const del = el('button', 'btn btn-danger', '삭제');
      del.onclick = async () => {
        if (!confirm('이 기록을 삭제할까요? 사진도 함께 삭제되고 주간 랭킹에서도 빠져요.')) return;
        del.disabled = true;
        const res = await api('DELETE', '/workouts/' + w.id);
        if (!res.ok) {
          del.disabled = false;
          return toast(MESSAGES.remove[res.status] || '삭제하지 못했어요. (' + res.status + ')');
        }
        toast('삭제했어요.');
        location.hash = '#/me';
      };
      actions.append(photoBtn, file, del);
      d.appendChild(actions);
    }
    box.appendChild(d);

    const cbox = await commentsSection(w.id, seq);
    if (seq === viewSeq) v.appendChild(cbox);
  }

  // 댓글: 목록(인증 불필요) + 등록 + 본인 댓글 삭제
  async function commentsSection(workoutId, seq) {
    const box = el('section');
    const title = el('div', 'section-title');
    const count = el('span', null, '댓글');
    title.appendChild(count);
    box.appendChild(title);

    const form = el('div', 'comment-form');
    const ta = el('textarea', 'field');
    ta.maxLength = 300;
    ta.placeholder = '댓글을 남겨 보세요';
    ta.rows = 1;
    const submitBtn = el('button', 'btn btn-primary', '등록');
    form.append(ta, submitBtn);
    box.appendChild(form);
    const msg = el('div', 'msg');
    msg.style.padding = '0 20px';
    box.appendChild(msg);

    const list = el('div');
    box.appendChild(list);

    async function loadComments() {
      const r = await api('GET', '/workouts/' + workoutId + '/comments');
      if (seq !== viewSeq) return;
      list.replaceChildren();
      if (!r.ok) {
        list.appendChild(el('div', 'empty', '댓글을 불러오지 못했어요.'));
        return;
      }
      count.textContent = '댓글 ' + r.data.length + '개';
      if (r.data.length === 0) list.appendChild(el('div', 'empty', '아직 댓글이 없어요. 첫 댓글을 남겨 보세요.'));
      r.data.forEach((c) => list.appendChild(commentRow(c, loadComments)));
    }

    submitBtn.onclick = async () => {
      const content = ta.value.trim();
      if (!content) return (msg.textContent = '내용을 입력하세요.');
      submitBtn.disabled = true;
      const r = await api('POST', '/workouts/' + workoutId + '/comments', { content });
      submitBtn.disabled = false;
      if (!r.ok) return (msg.textContent = '댓글을 남기지 못했어요. (' + r.status + ')');
      ta.value = '';
      msg.textContent = '';
      loadComments();
    };
    ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitBtn.click(); } };

    await loadComments();
    return box;
  }

  function commentRow(c, onDeleted) {
    const row = el('div', 'comment-row');
    row.appendChild(avatar(c.userId, c.nickname));
    const body = el('div', 'body');
    body.appendChild(el('div', 'nick', c.nickname));
    body.appendChild(el('div', 'content', c.content));
    row.appendChild(body);
    if (me && c.userId === me.id) {
      const del = el('button', 'btn-link', '삭제');
      del.style.color = 'var(--danger)';
      del.onclick = async () => {
        if (!confirm('댓글을 삭제할까요?')) return;
        del.disabled = true;
        const r = await api('DELETE', '/comments/' + c.id);
        if (!r.ok) { del.disabled = false; return toast('삭제하지 못했어요. (' + r.status + ')'); }
        onDeleted();
      };

  const goProfile = (id) => { location.hash = '#/users/' + id; };

  // following: 지금 팔로우 중인지. onChange(following) 는 결과가 바뀐 뒤 호출됨
  function followButton(userId, following, onChange) {
    const btn = el('button');
    btn.dataset.userId = userId;
    const render = () => {
      btn.textContent = following ? '팔로우 취소' : '팔로우';
      btn.className = 'btn ' + (following ? 'btn-gray' : 'btn-primary');
    };
    render();
    btn.onclick = async (e) => {
      e.stopPropagation();
      if (following && !confirm('팔로우를 취소할까요? 관심 피드에서 이 사람 기록이 빠져요.')) return;
      btn.disabled = true;
      const r = await api(following ? 'DELETE' : 'POST', '/users/' + userId + '/follow');
      btn.disabled = false;
      if (r.status === 409) {  // 다른 화면에서 이미 팔로우함
        following = true;
        render();
        return toast('이미 팔로우 중이에요.');
      }
      if (!r.ok) return toast('처리하지 못했어요. (' + r.status + ')');
      following = !following;
      render();
      // 같은 사람의 버튼이 화면에 여러 개 있으면 함께 바꿈
      document.querySelectorAll('button[data-user-id="' + userId + '"]').forEach((b) => {
        if (b !== btn) b.dispatchEvent(new CustomEvent('sync', { detail: following }));
      });
      toast(following ? '팔로우했어요. 관심 피드에 기록이 떠요.' : '팔로우를 취소했어요.');
      if (onChange) onChange(following);
    };
    btn.addEventListener('sync', (e) => { following = e.detail; render(); });
    return btn;
  }

  function userRow(u) {
    const row = el('div', 'user-row');
    const a = avatar(u.id, u.nickname, u.photoUrl);
    a.classList.add('lg', 'clickable');
    a.onclick = () => goProfile(u.id);
    const isMe = me && u.id === me.id;
    const name = el('div', 'name', u.nickname + (isMe ? ' (나)' : ''));
    name.onclick = () => goProfile(u.id);
    row.append(a, name);
    if (!isMe) row.appendChild(followButton(u.id, u.following));
    return row;
  }

  // Page 응답(content, last, totalPages, totalElements)을 목록 공통 형태로 바꿈
  const pageResult = (r) => ({
    ok: r.ok,
    items: r.ok ? r.data.content : [],
    hasMore: r.ok && !r.data.last,
    totalPages: r.ok ? r.data.totalPages : null,
    total: r.ok ? r.data.totalElements : 0,
  });

  // 목록 + 가운데 정렬 페이지 번호. load(page) 는 { ok, items, hasMore, totalPages? } 를 돌려줌
  // 전체 페이지 수를 모르는 배열 응답은 지금까지 확인한 페이지(+다음 페이지)까지만 번호로 보여 줌
  function pagedList(box, load, render, emptyText, seq, opts = {}) {
    const list = el('div', opts.listClass || null);
    const pager = el('div', 'pager');
    pager.setAttribute('role', 'navigation');
    pager.setAttribute('aria-label', '페이지');
    pager.hidden = true;
    box.append(list, pager);
    let known = 1;
    let busy = false;

    async function go(page, scroll) {
      if (busy) return;
      busy = true;
      pager.querySelectorAll('button').forEach((b) => { b.disabled = true; });
      const r = await load(page);
      busy = false;
      if (seq !== viewSeq) return;
      list.replaceChildren();
      if (!r.ok) {
        list.appendChild(el('div', 'empty', opts.errorText || '불러오지 못했어요.'));
        pager.hidden = true;
        return;
      }
      if (opts.onLoad) opts.onLoad(r, page);
      if (r.items.length === 0) list.appendChild(el('div', 'empty', page === 0 ? emptyText : '이 페이지에는 항목이 없어요.'));
      r.items.forEach((item) => list.appendChild(render(item)));
      known = r.totalPages != null ? r.totalPages : Math.max(known, page + (r.hasMore ? 2 : 1));
      renderPager(page, r.hasMore);
      // 목록을 바꾼 뒤 목록 맨 위로 바로 이동 (고정 헤더 높이만큼 여유를 둠)
      if (scroll) window.scrollTo(0, Math.max(0, box.getBoundingClientRect().top + window.scrollY - 132));
    }

    function renderPager(page, hasMore) {
      pager.replaceChildren();
      pager.hidden = known <= 1;
      if (pager.hidden) return;
      const button = (label, target, className) => {
        const b = el('button', className, label);
        b.type = 'button';
        b.onclick = () => go(target, true);
        return b;
      };
      const prev = button('이전', page - 1, 'step');
      prev.disabled = page === 0;
      pager.appendChild(prev);
      // 현재 페이지를 가운데에 두고 번호는 최대 5개
      const start = Math.max(0, Math.min(page - 2, known - 5));
      const end = Math.min(known, start + 5);
      for (let p = start; p < end; p++) {
        const b = button(String(p + 1), p);
        if (p === page) {
          b.setAttribute('aria-current', 'page');
          b.onclick = null;
        }
        pager.appendChild(b);
      }
      const next = button('다음', page + 1, 'step');
      next.disabled = !hasMore;
      pager.appendChild(next);
    }

    go(0, false);
  }

  // 사람 찾기 (q 없으면 전체). 배열 응답
  const loadUsers = (q) => async (page) => {
    const r = await api('GET', '/users?page=' + page + (q ? '&q=' + encodeURIComponent(q) : ''));
    return { ok: r.ok, items: r.ok ? r.data : [], hasMore: r.ok && r.data.length === PAGE_SIZE };
  };

  function suggestUsers(v, seq) {
    const box = el('section');
    box.appendChild(el('div', 'section-title', '추천 사용자'));
    v.appendChild(box);
    pagedList(box, loadUsers(''), userRow, '아직 다른 사용자가 없어요.', seq);
  }

  function searchView(q) {
    const { v, seq } = newView();
    if (document.activeElement !== $('searchInput')) $('searchInput').value = q;
    const box = el('section');
    box.appendChild(el('div', 'section-title', q ? "'" + q + "' 검색 결과" : '모든 사용자'));
    v.appendChild(box);
    pagedList(box, loadUsers(q), userRow, '일치하는 사용자가 없어요.', seq);
  }

  // 프로필: 기록 · 팔로워 · 팔로잉 수, 팔로우 버튼, 그 사람의 기록(6, Page 응답)
  async function profileView(id) {
    const { v, seq } = newView();
    const r = await api('GET', '/users/' + id + '/profile');
    if (seq !== viewSeq) return;
    if (!r.ok) {
      v.appendChild(el('section')).appendChild(el('div', 'empty', r.status === 404 ? '없는 사용자예요.' : '프로필을 불러오지 못했어요.'));
      return;
    }
    const pf = r.data;
    const head = el('section', 'profile-head');
    const a = avatar(pf.id, pf.nickname, pf.photoUrl);
    a.classList.add('xl');
    const info = el('div', 'info');
    const top = el('div', 'top');
    top.appendChild(el('span', 'nick', pf.nickname));
    const followerNum = el('b', null, pf.followerCount);
    if (pf.me) {
      const go = el('a', 'btn btn-gray', '마이페이지');
      go.href = '#/me';
      top.appendChild(go);
    } else {
      top.appendChild(followButton(pf.id, pf.following, (following) => {
        followerNum.textContent = Number(followerNum.textContent) + (following ? 1 : -1);
      }));
    }
    const stats = el('div', 'stats');
    const stat = (label, num, href) => {
      const x = el('span', href ? 'link' : null);
      x.append(label + ' ', num);
      if (href) x.onclick = () => { location.hash = href; };
      return x;
    };
    stats.append(stat('기록', el('b', null, pf.workoutCount)),
        stat('팔로워', followerNum, '#/users/' + pf.id + '/followers'),
        stat('팔로잉', el('b', null, pf.followeeCount), '#/users/' + pf.id + '/followees'));
    info.append(top, el('div', 'joined', formatJoined(pf.joinedAt)), stats);
    head.append(a, info);
    v.appendChild(head);

    const box = el('section');
    box.appendChild(el('div', 'section-title', pf.me ? '내 운동 기록' : pf.nickname + '님의 운동 기록'));
    v.appendChild(box);
    pagedList(box, async (page) => pageResult(await api('GET', '/users/' + id + '/workouts?page=' + page + '&size=' + WORKOUT_PAGE)),
      (w) => listItem(w), '아직 운동 기록이 없어요.', seq);
  }

  // 12. 주간 랭킹 TOP 10 ({week, entries:[{rank, userId, nickname, minutes}]})
  // offset: 이번 주 0, 지난주 -1 ... 서버는 date가 속한 주(월~일, ISO 주차)를 돌려줌
  function mondayOf(d) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
    return x;
  }
  const ymd = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const md = (d) => (d.getMonth() + 1) + '/' + d.getDate();

  function formatMinutes(m) {
    const h = Math.floor(m / 60);
    return h ? h + '시간' + (m % 60 ? ' ' + (m % 60) + '분' : '') : m + '분';
  }

  async function rankingView(offset) {
    const { v, seq } = newView();
    const monday = mondayOf(new Date());
    monday.setDate(monday.getDate() + offset * 7);
    const sunday = new Date(monday);
    sunday.setDate(monday.getDate() + 6);

    const box = el('section');
    const nav = el('div', 'week-nav');
    const prev = el('button', 'btn btn-gray', '← 지난주');
    prev.onclick = () => { location.hash = '#/ranking?w=' + (offset - 1); };
    const next = el('button', 'btn btn-gray', '다음 주 →');
    next.disabled = offset >= 0;  // 아직 오지 않은 주는 볼 수 없음
    next.onclick = () => { location.hash = '#/ranking?w=' + (offset + 1); };
    const label = el('div', 'label');
    const title = el('b', null, offset === 0 ? '이번 주 랭킹' : offset === -1 ? '지난주 랭킹' : (-offset) + '주 전 랭킹');
    label.append(title, el('span', null, md(monday) + ' ~ ' + md(sunday) + ' · 운동 시간 TOP 10'));
    nav.append(prev, label, next);
    box.appendChild(nav);
    v.appendChild(box);

    const r = await api('GET', '/rankings/weekly?date=' + ymd(monday));
    if (seq !== viewSeq) return;
    if (!r.ok) {
      box.appendChild(el('div', 'empty', '랭킹을 불러오지 못했어요.'));
      return;
    }
    const entries = r.data.entries;
    if (entries.length === 0) {
      box.appendChild(el('div', 'empty', offset === 0 ? '이번 주에는 아직 기록이 없어요. 첫 번째로 기록해 보세요!' : '이 주에는 기록이 없어요.'));
      return;
    }
    const top = entries[0].minutes || 1;
    for (const e of entries) {
      const row = el('div', 'rank-row' + (me && e.userId === me.id ? ' me' : ''));
      row.onclick = () => goProfile(e.userId);
      const num = el('div', 'rank-num' + (e.rank <= 3 ? ' medal medal-' + e.rank : ''), e.rank);
      if (e.rank <= 3) num.setAttribute('aria-label', ['금메달', '은메달', '동메달'][e.rank - 1] + ' ' + e.rank + '위');
      const a = avatar(e.userId, e.nickname);
      a.classList.add('lg');
      const who = el('div', 'who');
      who.appendChild(el('div', 'nick', e.nickname + (me && e.userId === me.id ? ' (나)' : '')));
      const bar = el('div', 'bar');
      const fill = el('div');
      fill.style.width = Math.max(4, Math.round((e.minutes / top) * 100)) + '%';
      bar.appendChild(fill);
      who.appendChild(bar);
      row.append(num, a, who, el('div', 'mins', formatMinutes(e.minutes)));
      box.appendChild(row);
    }
    if (me && !entries.some((e) => e.userId === me.id)) {
      box.appendChild(el('div', 'my-rank', offset === 0
          ? '아직 TOP 10에 없어요. 운동을 기록하면 이번 주 랭킹에 반영돼요.'
          : '이 주에는 TOP 10에 들지 못했어요.'));
    }
  }

  function route() {
    if (!me) return;
    const h = location.hash || '#/';
    $('navFeed').classList.toggle('on', h === '#/' || h === '#');
    $('navMe').classList.toggle('on', h === '#/me');
    $('navRank').classList.toggle('on', h.startsWith('#/ranking'));
    if (!h.startsWith('#/search')) $('searchInput').value = '';
    const m = h.match(/^#\/workouts\/(\d+)$/);
    if (m) return detailView(Number(m[1]));
    const u = h.match(/^#\/users\/(\d+)$/);
    if (u) return profileView(Number(u[1]));
    const fl = h.match(/^#\/users\/(\d+)\/(followers|followees)$/);
    if (fl) return followListView(Number(fl[1]), fl[2]);
    if (h.startsWith('#/search')) return searchView(new URLSearchParams(h.split('?')[1] || '').get('q') || '');
    if (h === '#/me') return myView();
    if (h.startsWith('#/ranking')) {
      const w = Number(new URLSearchParams(h.split('?')[1] || '').get('w') || 0);
      return rankingView(Number.isInteger(w) && w <= 0 ? w : 0);
    }
    feedView();
  }

  // ---------- 이벤트 ----------

  $('submitBtn').onclick = submitAuth;
  $('password').onkeydown = (e) => { if (e.key === 'Enter' && !signupMode) submitAuth(); };
  $('switchBtn').onclick = () => setSignupMode(!signupMode);
  $('logoutBtn').onclick = () => logout();
  let searchTimer;
  $('searchInput').oninput = (e) => {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(() => {
      const target = '#/search' + (q ? '?q=' + encodeURIComponent(q) : '');
      if (location.hash !== target) location.hash = target;
    }, 300);
  };
  $('searchInput').onfocus = () => { if (!location.hash.startsWith('#/search')) location.hash = '#/search'; };
  window.addEventListener('hashchange', route);

  if (token) enter(); else logout();
</script>
</body>
</html>
